<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | S.L.A Fruit Shop</title>
    <meta name="description" content="Page not found - S.L.A Fruit Shop, Kattumavadi">
    <link rel="icon" href="images/SLA-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #faf8f3;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        .blob { position: fixed; border-radius: 50%; pointer-events: none; filter: blur(40px); opacity: .35; }
        .blob-1 { width: 480px; height: 480px; background: #2a9d8f; top: -160px; right: -120px; animation: float 9s ease-in-out infinite; }
        .blob-2 { width: 420px; height: 420px; background: #e76f51; bottom: -160px; left: -120px; animation: float 11s ease-in-out infinite reverse; }
        @keyframes float { 0%,100% { transform: translate(0,0) } 50% { transform: translate(30px,-30px) } }
        .card {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 560px;
            margin: 1.5rem;
            padding: 3.5rem 3rem;
            background: rgba(255,255,255,.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,0,0,.06);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,.12);
        }
        .fruit { font-size: 4.5rem; display: inline-block; animation: wiggle 3.5s ease-in-out infinite; }
        @keyframes wiggle { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-14deg) } 75% { transform: rotate(14deg) } }
        .code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 6rem;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, #2a9d8f, #e76f51);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: .5rem 0;
        }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; margin-bottom: .5rem; }
        p { color: #6b7280; font-size: 1rem; line-height: 1.7; margin-bottom: 2rem; }
        .actions { display: flex; gap: .9rem; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .9rem 1.9rem;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: .95rem;
            transition: transform .25s cubic-bezier(.175,.885,.32,1.1), box-shadow .25s ease;
        }
        .btn-primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; box-shadow: 0 8px 24px rgba(37,99,235,.35); }
        .btn-secondary { background: #fff; color: #1a1a2e; border: 1px solid rgba(0,0,0,.1); }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,.18); }
        .btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
        @media (max-width: 480px) {
            .card { padding: 2.5rem 1.5rem; }
            .code { font-size: 4.5rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            .fruit, .blob-1, .blob-2 { animation: none; }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="card">
        <span class="fruit" aria-hidden="true">🍎</span>
        <div class="code">404</div>
        <h1>Oops, this page took a wrong turn!</h1>
        <p>The page you're looking for isn't in our fruit basket. It may have been moved, renamed, or never existed. Let's get you back to fresh fruits!</p>
        <div class="actions">
            <a href="/" class="btn btn-primary">🏠 Back to Home</a>
            <a href="tel:9715840263" class="btn btn-secondary">📞 Call Us</a>
        </div>
    </div>
</body>
</html>
