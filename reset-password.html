<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - S.L.A Fruit Shop</title>
    <link rel="icon" href="images/SLA-logo.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .reset-card {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
        }
        .reset-card .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .reset-card .logo-row .logo-icon {
            font-size: 2rem;
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 10px;
        }
        .reset-card .logo-row .logo-main {
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 0.05em;
        }
        .reset-card .logo-row .logo-sub {
            display: block;
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            color: var(--text-secondary);
        }
        .reset-card h3 {
            text-align: center;
            margin-bottom: 0.25rem;
        }
        .reset-card .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        #reset-msg {
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            min-height: 1.2em;
            text-align: center;
        }
        #reset-msg.error { color: #dc2626; }
        #reset-msg.success { color: #16a34a; }
        #reset-msg.muted { color: var(--text-secondary); }
        .reset-success-actions {
            text-align: center;
        }
        .link-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="glass-card reset-card">
        <div class="logo-row">
            <img src="images/SLA-logo.png" alt="S.L.A Fruit Shop logo" class="logo-icon">
            <span class="logo-text">
                <span class="logo-main">S.L.A</span>
                <span class="logo-sub">FRUIT SHOP</span>
            </span>
        </div>
        <h3>Reset Password</h3>
        <p class="subtitle" id="page-subtitle">Choose a new password for your account</p>
        <div id="reset-msg" class="muted"></div>
        <form id="reset-form">
            <div class="input-group">
                <input type="password" id="new-password" placeholder=" " required autocomplete="new-password">
                <label for="new-password">New Password</label>
            </div>
            <div class="input-group">
                <input type="password" id="confirm-password" placeholder=" " required autocomplete="new-password">
                <label for="confirm-password">Confirm Password</label>
            </div>
            <button type="submit" id="reset-btn" class="btn-primary btn-full">Set New Password</button>
        </form>
        <div id="reset-success" class="reset-success-actions hidden">
            <a href="/" class="btn-primary btn-full">Go to Sign In</a>
        </div>
    </div>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const form = document.getElementById('reset-form');
            const msg = document.getElementById('reset-msg');
            const btn = document.getElementById('reset-btn');
            const successBox = document.getElementById('reset-success');
            const subtitle = document.getElementById('page-subtitle');

            function show(type, text) {
                msg.className = type;
                msg.textContent = text;
            }

            if (!token) {
                show('error', 'This reset link is invalid or has expired. Please request a new one.');
                form.classList.add('hidden');
                const link = document.createElement('p');
                link.innerHTML = '<a class="link-btn" href="/">Back to home</a>';
                link.style.textAlign = 'center';
                document.querySelector('.reset-card').appendChild(link);
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const password = document.getElementById('new-password').value;
                const confirm = document.getElementById('confirm-password').value;

                if (password.length < 6) {
                    show('error', 'Password must be at least 6 characters');
                    return;
                }
                if (password !== confirm) {
                    show('error', 'Passwords do not match');
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Resetting...';
                try {
                    const res = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, password })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Could not reset your password');
                    show('success', data.message);
                    form.classList.add('hidden');
                    subtitle.textContent = 'All done!';
                    successBox.classList.remove('hidden');
                } catch (err) {
                    show('error', err.message);
                }
                btn.disabled = false;
                btn.textContent = 'Set New Password';
            });
        })();
    </script>
</body>
</html>
